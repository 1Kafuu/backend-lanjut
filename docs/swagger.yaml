basePath: /api/v1
definitions:
  model.AddProjectRequest:
    properties:
      link:
        type: string
      technologies:
        items:
          type: string
        maxItems: 10
        type: array
      title:
        maxLength: 120
        minLength: 3
        type: string
      year:
        maximum: 2100
        minimum: 1900
        type: integer
    required:
    - technologies
    - title
    - year
    type: object
  model.AssignRoleRequest:
    properties:
      role:
        type: string
    type: object
  model.Certificate:
    properties:
      id:
        type: string
      issued_at:
        type: string
      issuer:
        type: string
      name:
        type: string
    type: object
  model.CertificateRequest:
    properties:
      issued_at:
        type: string
      issuer:
        maxLength: 120
        minLength: 2
        type: string
      name:
        maxLength: 120
        minLength: 3
        type: string
    required:
    - issued_at
    - issuer
    - name
    type: object
  model.Course:
    properties:
      code:
        type: string
      created_at:
        type: string
      credits:
        type: integer
      enrolled_count:
        type: integer
      id:
        type: integer
      name:
        type: string
      quota:
        type: integer
      version:
        type: integer
    type: object
  model.CreateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 10
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      tags:
        items:
          type: string
        maxItems: 5
        type: array
    required:
    - comment
    - rating
    type: object
  model.CreateStudentRequest:
    properties:
      grade:
        maximum: 4
        minimum: 0
        type: number
      name:
        type: string
      nim:
        type: integer
    required:
    - name
    - nim
    type: object
  model.CursorMeta:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  model.MyCourses:
    properties:
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      max_credits:
        type: integer
      total_credits:
        type: integer
    type: object
  model.MyProfile:
    properties:
      permissions:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/model.User'
    type: object
  model.Notification:
    properties:
      body:
        type: string
      channel:
        type: string
      id:
        type: integer
      outbox_id:
        type: integer
      sent_at:
        type: string
      subject:
        type: string
      user_id:
        type: integer
    type: object
  model.PatchStudentRequest:
    properties:
      grade:
        maximum: 4
        minimum: 0
        type: number
      is_active:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      nim:
        type: integer
    type: object
  model.PatchUserRequest:
    properties:
      email:
        maxLength: 120
        type: string
      is_active:
        type: boolean
      username:
        maxLength: 30
        minLength: 3
        type: string
    type: object
  model.Portfolio:
    properties:
      bio:
        type: string
      certificates:
        items:
          $ref: '#/definitions/model.Certificate'
        type: array
      created_at:
        type: string
      headline:
        type: string
      projects:
        items:
          $ref: '#/definitions/model.Project'
        type: array
      student_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.Prestasi:
    properties:
      created_at:
        type: string
      id:
        type: integer
      juara:
        type: string
      nama_prestasi:
        type: string
      student_id:
        type: integer
    type: object
  model.Project:
    properties:
      id:
        type: string
      link:
        type: string
      technologies:
        items:
          type: string
        type: array
      title:
        type: string
      year:
        type: integer
    type: object
  model.ProjectRequest:
    properties:
      link:
        type: string
      technologies:
        items:
          type: string
        maxItems: 10
        type: array
      title:
        maxLength: 120
        minLength: 3
        type: string
      year:
        maximum: 2100
        minimum: 1900
        type: integer
    required:
    - technologies
    - title
    - year
    type: object
  model.QueueInfo:
    properties:
      active:
        type: integer
      archived:
        type: integer
      completed:
        type: integer
      failed_today:
        type: integer
      name:
        type: string
      pending:
        type: integer
      processed_today:
        type: integer
      retry:
        type: integer
      scheduled:
        type: integer
    type: object
  model.QueueStats:
    properties:
      notifications_sent:
        type: integer
      oldest_pending_age:
        type: string
      outbox_pending:
        type: integer
      outbox_published:
        type: integer
      queue:
        $ref: '#/definitions/model.QueueInfo'
      queue_error:
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        maxLength: 120
        type: string
      password:
        maxLength: 72
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  model.ReplaceStudentRequest:
    properties:
      grade:
        maximum: 4
        minimum: 0
        type: number
      is_active:
        type: boolean
      name:
        maxLength: 120
        type: string
      nim:
        type: integer
    required:
    - grade
    - is_active
    - name
    - nim
    type: object
  model.ReplaceUserRequest:
    properties:
      email:
        maxLength: 120
        type: string
      is_active:
        type: boolean
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  model.Reply:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  model.ReplyRequest:
    properties:
      body:
        maxLength: 500
        minLength: 2
        type: string
    required:
    - body
    type: object
  model.Review:
    properties:
      comment:
        type: string
      course_id:
        type: integer
      created_at:
        type: string
      helpful_count:
        type: integer
      id:
        type: string
      rating:
        type: integer
      replies:
        items:
          $ref: '#/definitions/model.Reply'
        type: array
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  model.ReviewPage:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Review'
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/model.ReviewPageMeta'
      success:
        type: boolean
    type: object
  model.ReviewPageMeta:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      next_before:
        type: string
    type: object
  model.ReviewSummary:
    properties:
      average_rating:
        type: number
      count:
        type: integer
      course_id:
        type: integer
      distribution:
        additionalProperties:
          type: integer
        type: object
      top_tags:
        items:
          $ref: '#/definitions/model.TagCount'
        type: array
    type: object
  model.Student:
    properties:
      created_at:
        type: string
      grade:
        type: number
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      nim:
        type: integer
      owner_id:
        type: integer
    type: object
  model.SwapRequest:
    properties:
      from_course_id:
        minimum: 1
        type: integer
      to_course_id:
        minimum: 1
        type: integer
    required:
    - from_course_id
    - to_course_id
    type: object
  model.TagCount:
    properties:
      tag:
        type: string
      total:
        type: integer
    type: object
  model.TechnologyCount:
    properties:
      technology:
        type: string
      total:
        type: integer
    type: object
  model.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        description: '"Bearer"'
        type: string
    type: object
  model.UpdateQuotaRequest:
    properties:
      quota:
        maximum: 500
        minimum: 1
        type: integer
      version:
        minimum: 1
        type: integer
    required:
    - quota
    - version
    type: object
  model.UpdateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 10
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      tags:
        items:
          type: string
        maxItems: 5
        type: array
    type: object
  model.UpsertPortfolioRequest:
    properties:
      bio:
        maxLength: 2000
        type: string
      certificates:
        items:
          $ref: '#/definitions/model.CertificateRequest'
        maxItems: 20
        type: array
      headline:
        maxLength: 120
        minLength: 3
        type: string
      projects:
        items:
          $ref: '#/definitions/model.ProjectRequest'
        maxItems: 20
        type: array
    required:
    - headline
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
  model.UserCursorPage:
    properties:
      data:
        items:
          $ref: '#/definitions/model.User'
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/model.CursorMeta'
      success:
        type: boolean
    type: object
  model.WebResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/model.Meta'
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    API pendaftaran kelas (KRS), ulasan kelas, dan notifikasi.
    Seluruh endpoint selain /auth memerlukan access token.
  title: API KRS Praktikum Backend Lanjut
  version: "1.0"
paths:
  /admin/queue:
    get:
      description: Ringkasan outbox dan queue Asynq. Tetap berhasil walau Redis mati.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.QueueStats'
              type: object
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Tidak memiliki hak queue:monitor
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Keadaan antrean notifikasi
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Dibatasi 5 kali gagal per menit per IP.
      parameters:
      - description: Username dan password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "401":
          description: Username atau password salah
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "429":
          description: Terlalu banyak percobaan login
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login dan mendapatkan pasangan token
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 'Idempoten: mencabut refresh token yang tidak ada tetap dianggap
        berhasil.'
      parameters:
      - description: Refresh token yang dicabut
        in: body
        name: body
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WebResponse'
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Keluar dan mencabut refresh token
      tags:
      - auth
  /auth/me:
    get:
      description: Data akun dan daftar permission sesuai role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.MyProfile'
              type: object
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Profil saya
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Refresh token dirotasi: token lama langsung dicabut saat yang
        baru terbit.'
      parameters:
      - description: Refresh token lama
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "401":
          description: Refresh token tidak valid atau kedaluwarsa
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Memperbarui access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Role akun baru selalu "user". Password minimal 8 karakter dan memuat
        huruf serta angka.
      parameters:
      - description: Data akun baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Username sudah dipakai
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal; detail per field ada di fields
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Mendaftarkan akun baru
      tags:
      - auth
  /courses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Course'
                  type: array
              type: object
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar seluruh kelas
      tags:
      - courses
  /courses/{id}:
    get:
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "400":
          description: ID bukan angka positif
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Kelas tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail satu kelas
      tags:
      - courses
    patch:
      consumes:
      - application/json
      description: 'Optimistic locking: kirim version yang terakhir dilihat. Membutuhkan
        permission course:manage.'
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      - description: Kuota baru dan version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Tidak memiliki hak course:manage
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Kelas tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: VERSION_CONFLICT atau QUOTA_BELOW_ENROLLED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mengubah kuota kelas (admin)
      tags:
      - courses
  /courses/{id}/enroll:
    delete:
      description: Mengurangi satu kursi dan menulis satu event enrollment.dropped
        ke outbox.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Kursi dilepas
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Tidak terdaftar pada kelas ini
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Keluar dari sebuah kelas
      tags:
      - courses
    post:
      description: Menambah satu kursi dan menulis satu event enrollment.created ke
        outbox bila seluruh langkah berhasil.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Kelas tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: COURSE_FULL atau sudah terdaftar
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mendaftar ke sebuah kelas
      tags:
      - courses
  /courses/{id}/reviews:
    get:
      description: Mendukung paginasi berbasis cursor sebelum.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      - description: Saring satu tag
        in: query
        name: tag
        type: string
      - description: Cursor halaman sebelumnya
        in: query
        name: before
        type: string
      - description: Jumlah data per halaman (1-50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ReviewPage'
        "400":
          description: ID bukan angka positif
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar ulasan sebuah kelas
      tags:
      - reviews
    post:
      consumes:
      - application/json
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      - description: Isi ulasan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Review'
              type: object
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: NOT_ENROLLED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: ALREADY_REVIEWED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Membuat ulasan untuk sebuah kelas
      tags:
      - reviews
  /courses/{id}/reviews/summary:
    get:
      description: Jumlah ulasan, rata-rata rating, sebaran rating, dan tag terpopuler.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ReviewSummary'
              type: object
        "400":
          description: ID bukan angka positif
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Kelas tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ringkasan ulasan sebuah kelas
      tags:
      - reviews
  /courses/mine:
    get:
